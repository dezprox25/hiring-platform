name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build:
    name: Lint, Build & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Frontend Deps
        run: npm ci
      
      - name: Frontend Lint
        run: npm run lint
      
      - name: Frontend TypeCheck
        run: npm run build -- --noEmit
      
      - name: Frontend Build
        run: npm run build

      - name: Install Backend Deps
        run: cd dezprox-backend && npm ci
      
      - name: Backend Lint
        run: cd dezprox-backend && npm run lint
      
      - name: Backend Test
        run: cd dezprox-backend && npm run test
      
      - name: Backend E2E Test
        run: cd dezprox-backend && npm run test:e2e
      
      - name: Backend Build
        run: cd dezprox-backend && npm run build

  docker-validation:
    name: Docker Validation
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Frontend Image
        run: docker build -t dezprox-frontend:latest .
      - name: Build Backend Image
        run: docker build -t dezprox-backend:latest ./dezprox-backend

  e2e-tests:
    name: Playwright E2E Tests
    needs: lint-and-build
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: Start Services
        run: |
          docker-compose up -d
          # Wait for services to be healthy
          sleep 30
      
      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:5173
      
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
